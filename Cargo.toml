[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/storage",
    "crates/queue",
    "crates/channels",
    "crates/templates",
    "crates/worker",
    "crates/api",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jeraldoalday/notification-service"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
